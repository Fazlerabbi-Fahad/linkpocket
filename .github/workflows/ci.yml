# CI for the web app (SRS 10.1 step 2): format, lint, typecheck, unit tests with coverage,
# build, E2E and accessibility (Playwright, axe-core), and dependency checks (NFR-M2, NFR-S12,
# NFR-U5, AC-20, AC-23). A green run on main starts deploy.yml (staging, then production
# behind an approval).
#
# The E2E job runs the real API: it checks out the API repository (repository variable
# API_REPOSITORY, for example "my-org/linkpocket-api", branch API_REF or main) as `api/` next
# to this one as `frontend/`, the same layout as on disk. A private API repository also needs the API_REPO_TOKEN secret (a fine-grained
# token with read access to its contents).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript strict)
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          # Placeholder for the Next.js rewrite target; not a secret.
          API_INTERNAL_URL: http://localhost:4000

  e2e:
    name: End-to-end and accessibility (Playwright, axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY }}
          ref: ${{ vars.API_REF || 'main' }}
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            api/pnpm-lock.yaml
      - name: Install (web and API)
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir api install --frozen-lockfile
      - name: Cache MongoDB test binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('api/pnpm-lock.yaml') }}
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # AC-1, AC-5, AC-6 and NFR-U5: the a11y spec fails on any axe WCAG 2.1 AA violation.
      - name: Playwright
        working-directory: frontend
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NFR-S12 / AC-23: high or critical findings fail the build.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  dependency-review:
    # NFR-S12 software composition analysis (OQ-16): GitHub's advisory database checks every
    # dependency a pull request adds or changes, including licences and transitive packages.
    name: Dependency review (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
